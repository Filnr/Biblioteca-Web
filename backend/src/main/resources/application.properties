spring.application.name=biblioteca-web
server.port=8080

# PostgreSQL (desenvolvimento). Dentro do Docker, as variaveis sobrescrevem os valores padrao.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/biblioteca_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
